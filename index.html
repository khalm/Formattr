<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formattr</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Roboto, -apple-system, sans-serif;
      margin: 0;
      padding: 16px 12px;
      background: #0d1117;
      color: #e6edf3;
    }
    .card {
      background: #161b22;
      padding: 20px 16px;
      border-radius: 14px;
      border: 1px solid #30363d;
      max-width: 460px;
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { margin: 0 0 2px 0; font-size: 1.5rem; letter-spacing: -0.5px; }
    .sub { color: #8b949e; font-size: 0.8rem; margin-bottom: 18px; }
    
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #58a6ff;
      border-bottom: 1px solid #21262d;
      padding-bottom: 4px;
      margin-top: 18px;
      margin-bottom: 10px;
    }

    label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 6px; font-weight: 500; }
    input[type="file"], input[type="text"] {
      width: 100%;
      padding: 12px;
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #58a6ff; }

    .fmt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .fmt-grid label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 4px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 0.85rem;
      cursor: pointer;
      margin: 0;
    }
    .fmt-grid input[type="checkbox"] { accent-color: #1f6feb; width: 16px; height: 16px; }

    .preview-box {
      margin-top: 14px;
      padding: 12px;
      background: #090d13;
      border: 1px dashed #30363d;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #7ee787;
      word-break: break-all;
    }

    .folder-btn {
      width: 100%;
      padding: 12px;
      background: #21262d;
      color: #c9d1d9;
      border: 1px dashed #30363d;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 4px;
    }
    .folder-btn.active {
      border-color: #238636;
      color: #3fb950;
      background: rgba(35, 134, 54, 0.1);
    }

    .main-btn {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .main-btn:disabled {
      background: #21262d;
      color: #484f58;
      cursor: not-allowed;
    }

    #status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #8b949e;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Formattr</h1>
  <div class="sub">Rask konvertering og nedskalering</div>

  <!-- Bildekilde -->
  <div class="section-title">1. Velg bilde</div>
  <input type="file" id="imageInput" accept="image/*">

  <!-- Målformater -->
  <div class="section-title">2. Formater</div>
  <div class="fmt-grid">
    <label><input type="checkbox" value="image/jpeg" class="fmt" checked> JPG</label>
    <label><input type="checkbox" value="image/png" class="fmt"> PNG</label>
    <label><input type="checkbox" value="image/webp" class="fmt" checked> WebP</label>
    <label><input type="checkbox" value="image/avif" class="fmt"> AVIF</label>
    <label><input type="checkbox" value="image/bmp" class="fmt"> BMP</label>
  </div>

  <!-- Piksler -->
  <div class="section-title">3. Bredder (px, kommaseparert)</div>
  <input type="text" id="widthsInput" value="1920, 1080, 800" placeholder="f.eks. 1920, 1080">

  <!-- Filnavn -->
  <div class="section-title">4. Filnavn</div>
  <label for="fileNameInput">Ønsket navn (uten størrelse og format):</label>
  <input type="text" id="fileNameInput" placeholder="bilde">

  <div class="preview-box">
    Eksempel på filnavn:<br>
    <span id="previewText">...</span>
  </div>

  <!-- Mappe og lagring -->
  <div class="section-title">5. Lagring</div>
  <button type="button" id="selectDirBtn" class="folder-btn">Velg målmappe (Standard: Nedlastinger)</button>

  <button id="convertBtn" class="main-btn" disabled>Start konvertering</button>

  <div id="status"></div>
<div class="share-app-wrap" style="text-align:center;margin:18px 0 8px"><button type="button" class="share-app-btn" style="display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:15px;font-weight:700;cursor:pointer;opacity:.85"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span>Del appen med noen</span></button></div>

</div>

<script>
  let currentImage = null;
  let originalFullFileName = '';
  let targetDirectoryHandle = null;

  const imageInput = document.getElementById('imageInput');
  const fileNameInput = document.getElementById('fileNameInput');
  const widthsInput = document.getElementById('widthsInput');
  const convertBtn = document.getElementById('convertBtn');
  const selectDirBtn = document.getElementById('selectDirBtn');
  const previewText = document.getElementById('previewText');
  const statusDiv = document.getElementById('status');

  function getExtension(mime) {
    if (mime === 'image/jpeg') return 'jpg';
    if (mime === 'image/png') return 'png';
    if (mime === 'image/webp') return 'webp';
    if (mime === 'image/avif') return 'avif';
    if (mime === 'image/bmp') return 'bmp';
    return 'img';
  }

  function getBaseName() {
    return fileNameInput.value.trim() || 'bilde';
  }

  function updatePreview() {
    const base = getBaseName();
    const firstCheckbox = document.querySelector('.fmt:checked');
    const ext = firstCheckbox ? getExtension(firstCheckbox.value) : 'webp';
    const widths = widthsInput.value.split(',').map(w => w.trim()).filter(Boolean);
    const sampleWidth = widths.length > 0 ? widths[0] : '1080';

    previewText.innerText = `${base}-${sampleWidth}.${ext}`;
  }

  fileNameInput.addEventListener('input', updatePreview);
  widthsInput.addEventListener('input', updatePreview);
  document.querySelectorAll('.fmt').forEach(cb => cb.addEventListener('change', updatePreview));

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    originalFullFileName = file.name;
    const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
    fileNameInput.value = baseName;

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        convertBtn.disabled = false;
        statusDiv.innerHTML = `Originalstørrelse: ${img.naturalWidth} &times; ${img.naturalHeight} px`;
        updatePreview();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  selectDirBtn.addEventListener('click', async () => {
    if ('showDirectoryPicker' in window) {
      try {
        targetDirectoryHandle = await window.showDirectoryPicker();
        selectDirBtn.innerText = `Mappe: ${targetDirectoryHandle.name}`;
        selectDirBtn.classList.add('active');
      } catch (err) {
        if (err.name !== 'AbortError') console.error(err);
      }
    } else {
      alert('Nettleseren din støtter ikke direkte mappevalg. Filene legges i standard Nedlastinger-mappe.');
    }
  });

  convertBtn.addEventListener('click', async () => {
    const selectedFormats = Array.from(document.querySelectorAll('.fmt:checked')).map(cb => cb.value);
    const targetWidths = widthsInput.value.split(',')
      .map(w => parseInt(w.trim(), 10))
      .filter(w => !isNaN(w) && w > 0);

    if (selectedFormats.length === 0 || targetWidths.length === 0) {
      alert('Velg minst ett format og én gyldig bredde.');
      return;
    }

    convertBtn.disabled = true;
    statusDiv.innerHTML = 'Behandler bilder...';

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const aspect = currentImage.naturalHeight / currentImage.naturalWidth;
    const baseName = getBaseName();

    let processedCount = 0;

    for (const width of targetWidths) {
      const targetW = Math.min(width, currentImage.naturalWidth);
      const targetH = Math.round(targetW * aspect);

      canvas.width = targetW;
      canvas.height = targetH;
      ctx.clearRect(0, 0, targetW, targetH);
      ctx.drawImage(currentImage, 0, 0, targetW, targetH);

      for (const format of selectedFormats) {
        const ext = getExtension(format);
        const fileName = `${baseName}-${targetW}.${ext}`;

        // Sikkerhetssperre: Nekt overskriving hvis navnet er identisk med kildebildet
        if (fileName.toLowerCase() === originalFullFileName.toLowerCase()) {
          alert(`Sikkerhetsstopp: Eksportnavnet "${fileName}" matcher originalbildet nøyaktig. Filen ble ikke lagret for å unngå overskriving av originalen.`);
          continue;
        }

        const blob = await new Promise(resolve => canvas.toBlob(resolve, format, 0.9));

        if (targetDirectoryHandle) {
          let fileExists = false;
          try {
            await targetDirectoryHandle.getFileHandle(fileName);
            fileExists = true;
          } catch (e) {
            fileExists = false;
          }

          if (fileExists) {
            const confirmed = confirm(`Filen "${fileName}" finnes allerede i mappen.\n\nVil du overskrive den?`);
            if (!confirmed) {
              continue;
            }
          }

          try {
            const fileHandle = await targetDirectoryHandle.getFileHandle(fileName, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(blob);
            await writable.close();
            processedCount++;
          } catch (err) {
            console.error('Kunne ikke skrive fil:', err);
          }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          processedCount++;
          await new Promise(r => setTimeout(r, 250));
        }
      }
    }

    statusDiv.innerHTML = `Ferdig! Lagret ${processedCount} fil(er).`;
    convertBtn.disabled = false;
  });

  updatePreview();

  // Registrering av Service Worker for PWA på Android
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(reg => console.log('SW registrert:', reg))
        .catch(err => console.error('SW feil:', err));
    });
  }
</script>

var list=null,base=null,busy=false,last=0,hiddenAt=0,touched=false,shown=false;

 var t=document.querySelectorAll('textarea,[contenteditable=""],[contenteditable="true"]');for(var i=0;i<t.length;i++){var v=t[i].value!=null?t[i].value:t[i].textContent;if(v&&v.trim()&&t[i].offsetParent)return true}return false}

 await Promise.all(list.map(function(u){return fetch(u,{cache:'reload'}).catch(function(){})}));
 try{var r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(_){}
 try{sessionStorage.setItem('__auLast',String(Date.now()))}catch(_){}
 location.reload()}

 b.style.cssText='position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:2147483647;background:#1f6feb;color:#fff;border:0;border-radius:999px;padding:11px 18px;font:700 15px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer;max-width:92%';
 b.onclick=function(){b.textContent='…';apply()};document.body.appendChild(b)}
async function check(){if(busy||!navigator.onLine||Date.now()-last<60000)return;busy=true;last=Date.now();
 try{if(!list)list=urls();if(!base){base=await digest(false);if(!base)return}
  var now=await digest(true);if(!now||now===base)return;
  var recent=0;try{recent=+sessionStorage.getItem('__auLast')||0}catch(_){}
  if(!touched&&!editing()&&Date.now()-recent>120000)apply();else banner()}
 catch(_){}finally{busy=false}}

</body>
</html>
